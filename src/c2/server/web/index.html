<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ananse — C2 Console</title>
<style>
:root {
  --bg: #0b0b12; --surface: #12121c; --surface2: #181828; --border: #1e1e32;
  --text: #d0d0dc; --dim: #686880; --accent: #d42a3a; --accent-hover: #e84c5e;
  --cyan: #3dd4c8; --green: #3cc46a;
  --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
body::before {
  content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at 20% 30%, rgba(212,42,58,0.05) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 70%, rgba(61,212,200,0.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 16px; display: flex; align-items: center; height: 48px; gap: 12px; z-index: 2; flex-shrink: 0;
}
.menu-btn { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
.menu-btn:hover { background: var(--surface2); color: var(--text); }
.logo { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
.logo .icon { width: 20px; height: 20px; background: var(--accent); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
.badge { font-size: 10px; padding: 2px 10px; border-radius: 3px; font-weight: 700; letter-spacing: 1px; border: 1px solid; }
.badge.offense { background: rgba(212,42,58,0.12); color: var(--accent); border-color: rgba(212,42,58,0.2); }
.badge.defense { background: rgba(61,212,200,0.1); color: var(--cyan); border-color: rgba(61,212,200,0.2); }
.badge.normal { background: rgba(255,255,255,0.05); color: var(--dim); border-color: rgba(255,255,255,0.1); }
.right { margin-left: auto; font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 12px; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot.on { background: var(--green); } .dot.off { background: var(--accent); }

#layout { display: flex; flex: 1; overflow: hidden; z-index: 1; }

#sidebar {
  width: 260px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; transition: margin-left .2s; overflow: hidden;
}
#sidebar.hidden { margin-left: -260px; }
#sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
#sidebar-header span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
#new-chat { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 600; cursor: pointer; letter-spacing: .5px; }
#sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
#sidebar-list::-webkit-scrollbar { width: 3px; }
#sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.sidebar-item {
  padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
  color: var(--dim); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar-item:hover { background: var(--surface2); color: var(--text); }
.sidebar-item.active { background: var(--surface2); color: var(--text); border-left: 2px solid var(--cyan); }
#sidebar-footer { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
#sidebar-footer button { background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 4px; padding: 5px 10px; font-size: 10px; cursor: pointer; font-family: var(--font); flex: 1; }
#sidebar-footer button:hover { border-color: var(--accent); color: var(--text); }

#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#chat { flex: 1; overflow-y: auto; }
#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
#chat-inner { max-width: 720px; margin: 0 auto; padding: 16px 20px; }

.msg { margin-bottom: 6px; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.msg.assistant { max-width: 92%; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg .label { font-size: 10px; font-weight: 600; letter-spacing: .5px; color: var(--dim); margin-bottom: 3px; }
.msg.assistant .label { color: var(--cyan); }
.msg .bubble { line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.msg.assistant .bubble { max-width: 100%; }
.msg.user .bubble { background: rgba(61,212,200,0.08); border-radius: 12px 4px 12px 12px; padding: 8px 14px; width: fit-content; max-width: 80%; }

.typing { display: flex; gap: 4px; padding: 6px 0; }
.typing span { width: 5px; height: 5px; background: var(--dim); border-radius: 50%; animation: pulse 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

#bar { background: var(--surface); border-top: 1px solid var(--border); padding: 14px 20px 18px; flex-shrink: 0; }
#bar-inner { max-width: 720px; margin: 0 auto; }
#row { display: flex; gap: 10px; }
#row input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: var(--text); font-family: var(--font); font-size: 13px; outline: none; transition: border-color .15s; }
#row input:focus { border-color: var(--cyan); }
#row input::placeholder { color: var(--dim); font-style: italic; }
#row button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 10px 18px; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
#row button:hover { background: var(--accent-hover); }
@media (max-width: 600px) { #sidebar { width: 200px; } #sidebar.hidden { margin-left: -200px; } }
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="logo"><span class="icon">◈</span> Ananse</div>
  <div class="badge" id="modeBadge">NORMAL</div>
  <div class="right"><span class="dot on"></span><span id="statusTxt">Connected</span></div>
</header>
<div id="layout">
  <div id="sidebar">
    <div id="sidebar-header"><span>History</span><button id="new-chat">+ New</button></div>
    <div id="sidebar-list"></div>
    <div id="sidebar-footer">
      <button id="clearBtn">Clear All</button>
    </div>
  </div>
  <div id="main">
    <div id="chat"><div id="chat-inner"></div></div>
    <div id="bar">
      <div id="bar-inner">
        <div id="row">
          <input type="text" id="input" placeholder="Type a message..." autofocus>
          <button id="send">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
var SESSIONS_KEY = 'ananse_sessions';
var SIDEBAR_KEY = 'ananse_sidebar';
var $ = function(s) { return document.querySelector(s); };
var chat = $('#chat-inner'), input = $('#input'), send = $('#send'), badge = $('#modeBadge');
var sessions = [];  // [{id, name, messages, mode}]
var currentId = null;
var sidebarOpen = true;

function saveSessions() { try { localStorage.setItem(SESSIONS_KEY, JSON.stringify({sessions: sessions, current: currentId})); } catch {} }

function getCurrent() {
  for (var i = 0; i < sessions.length; i++) { if (sessions[i].id === currentId) return sessions[i]; }
  return null;
}

function addMsg(role, text, persist) {
  if (persist === undefined) persist = true;
  var d = document.createElement('div'); d.className = 'msg ' + role;
  var l = document.createElement('div'); l.className = 'label';
  l.textContent = role === 'user' ? 'You' : 'Ananse';
  d.appendChild(l);
  var b = document.createElement('div'); b.className = 'bubble';
  b.textContent = text; d.appendChild(b);
  chat.appendChild(d); $('#chat').scrollTop = $('#chat').scrollHeight;
  if (persist) {
    var cur = getCurrent();
    if (cur) { cur.messages.push({role: role, text: text}); saveSessions(); updateSidebar(); }
  }
}

function renderChat(msgs) {
  chat.innerHTML = '';
  for (var i = 0; i < msgs.length; i++) {
    var d = document.createElement('div'); d.className = 'msg ' + msgs[i].role;
    var l = document.createElement('div'); l.className = 'label';
    l.textContent = msgs[i].role === 'user' ? 'You' : 'Ananse';
    d.appendChild(l);
    var b = document.createElement('div'); b.className = 'bubble';
    b.textContent = msgs[i].text; d.appendChild(b);
    chat.appendChild(d);
  }
  $('#chat').scrollTop = $('#chat').scrollHeight;
}

function updateSidebar() {
  sidebarList.innerHTML = '';
  for (var i = sessions.length - 1; i >= 0; i--) {
    var s = sessions[i];
    var first = '';
    for (var j = 0; j < s.messages.length; j++) { if (s.messages[j].role === 'user') { first = s.messages[j].text.slice(0, 40); break; } }
    if (!first) first = '(empty)';
    var item = document.createElement('div'); item.className = 'sidebar-item' + (s.id === currentId ? ' active' : '');
    item.textContent = first;
    item.addEventListener('click', function(id) { return function() { switchSession(id); }; }(s.id));
    sidebarList.appendChild(item);
  }
}

function switchSession(id) {
  currentId = id;
  var cur = getCurrent();
  if (cur) { renderChat(cur.messages); badge.textContent = cur.mode || 'NORMAL'; badge.className = 'badge ' + (cur.mode || 'NORMAL').toLowerCase(); }
  updateSidebar();
  saveSessions();
}

function newSession() {
  var cur = getCurrent();
  if (cur && cur.messages.length === 0) return; // don't save empty
  var id = 's' + Date.now();
  var mode = badge.textContent;
  sessions.push({id: id, name: '', messages: [], mode: mode});
  currentId = id;
  chat.innerHTML = '';
  saveSessions(); updateSidebar();
  addMsg('assistant', 'Ananse - Advanced Neural Agent for Network Security Exploitation. Ready. What would you like to do?');
}

function restore() {
  try {
    var raw = localStorage.getItem(SESSIONS_KEY);
    if (raw) {
      var data = JSON.parse(raw);
      sessions = data.sessions || [];
      currentId = data.current || null;
      if (currentId) {
        var cur = getCurrent();
        if (cur) {
          if (cur.mode) { badge.textContent = cur.mode; badge.className = 'badge ' + cur.mode.toLowerCase(); }
          renderChat(cur.messages);
          return;
        }
      }
    }
  } catch {}
  // No saved session - create one
  newSession();
}

$('#menuBtn').addEventListener('click', function() {
  sidebarOpen = !sidebarOpen;
  $('#sidebar').className = sidebarOpen ? '' : 'hidden';
  try { localStorage.setItem(SIDEBAR_KEY, sidebarOpen ? '1' : '0'); } catch {}
});

$('#new-chat').addEventListener('click', newSession);

$('#clearBtn').addEventListener('click', function() {
  if (!confirm('Delete all sessions?')) return;
  sessions = []; currentId = null; chat.innerHTML = '';
  try { localStorage.removeItem(SESSIONS_KEY); } catch {}
  updateSidebar();
  newSession();
});

var typing = null;
function showTyping() {
  if (typing) return;
  typing = document.createElement('div'); typing.className = 'msg assistant';
  var b = document.createElement('div'); b.className = 'bubble';
  var t = document.createElement('div'); t.className = 'typing';
  for (var i = 0; i < 3; i++) { var s = document.createElement('span'); t.appendChild(s); }
  b.appendChild(t); typing.appendChild(b); chat.appendChild(typing);
  $('#chat').scrollTop = $('#chat').scrollHeight;
}
function hideTyping() { if (typing) { typing.remove(); typing = null; } }

function setMode(m) {
  badge.textContent = m; badge.className = 'badge ' + m.toLowerCase();
  var cur = getCurrent(); if (cur) cur.mode = m; saveSessions();
  var sym = m === 'OFFENSE' ? '║' : m === 'DEFENSE' ? '║' : '║';
  var line1 = m === 'OFFENSE' ? '╔══════════════════════════╗' : m === 'DEFENSE' ? '╔══════════════════════════╗' : '╔══════════════════════════╗';
  var line2 = m === 'OFFENSE' ? '║      OFFENSE MODE        ║' : m === 'DEFENSE' ? '║      DEFENSE MODE        ║' : '║      NORMAL MODE         ║';
  var line3 = m === 'OFFENSE' ? '║  TAO//ECI - Full Spec Ops║' : m === 'DEFENSE' ? '║ FORNSAT//SI - SIGINT     ║' : '║  UNCLASSIFIED - General  ║';
  var line4 = '╚══════════════════════════╝';
  addMsg('assistant', line1 + '\n' + line2 + '\n' + line3 + '\n' + line4);
}

async function sendMsg(text) {
  if (!text.trim()) return;
  var t = text.trim().toLowerCase();
  if (['offense','defense','normal'].includes(t)) { setMode(t.toUpperCase()); input.value = ''; return; }
  input.value = ''; addMsg('user', text); showTyping();
  try {
    var cur = getCurrent();
    var msgs = cur ? cur.messages.slice(-20).map(function(m) { return {role: m.role, content: m.text}; }) : [];
    var r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, mode: badge.textContent, history: msgs})
    });
    hideTyping();
    if (!r.ok) { addMsg('assistant', 'Error: ' + (await r.text())); return; }
    var d = await r.json();
    addMsg('assistant', d.response || '(no response)');
    if (d.mode && d.mode !== badge.textContent) setMode(d.mode);
  } catch(e) { hideTyping(); addMsg('assistant', 'Connection error'); }
}

input.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMsg(input.value); });
send.addEventListener('click', function() { sendMsg(input.value); });

// Restore sidebar state
try { if (localStorage.getItem(SIDEBAR_KEY) === '0') { sidebarOpen = false; $('#sidebar').className = 'hidden'; } } catch {}

restore();
updateSidebar();
</script>
</body>
</html>
