<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ananse — C2 Console</title>
<style>
  :root {
    --bg: #0b0b12;
    --surface: #12121c;
    --surface2: #181828;
    --border: #1e1e32;
    --text: #d0d0dc;
    --dim: #686880;
    --accent: #d42a3a;
    --accent-hover: #e84c5e;
    --cyan: #3dd4c8;
    --green: #3cc46a;
    --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(212,42,58,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(61,212,200,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    height: 48px;
    gap: 14px;
    z-index: 1;
    flex-shrink: 0;
  }
  .logo { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
  .logo .icon { width: 20px; height: 20px; background: var(--accent); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 11px; }
  .badge {
    font-size: 10px; padding: 2px 10px; border-radius: 3px;
    font-weight: 700; letter-spacing: 1px; border: 1px solid;
  }
  .badge.offense { background: rgba(212,42,58,0.12); color: var(--accent); border-color: rgba(212,42,58,0.2); }
  .badge.defense { background: rgba(61,212,200,0.1); color: var(--cyan); border-color: rgba(61,212,200,0.2); }
  .badge.normal { background: rgba(255,255,255,0.05); color: var(--dim); border-color: rgba(255,255,255,0.1); }
  .right { margin-left: auto; font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--green); }
  .dot.off { background: var(--accent); }

  #chat { flex: 1; overflow-y: auto; padding: 20px; z-index: 1; }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { margin-bottom: 16px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.assistant { max-width: 90%; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg .label { font-size: 10px; font-weight: 600; letter-spacing: .5px; color: var(--dim); margin-bottom: 4px; }
  .msg.assistant .label { color: var(--cyan); }
  .msg.user .label { color: var(--dim); }
  .msg .bubble {
    line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 13px;
  }
  .msg.assistant .bubble {
    max-width: 100%;
  }
  .msg.user .bubble {
    background: rgba(61,212,200,0.08);
    border-radius: 12px 4px 12px 12px;
    padding: 10px 14px;
    width: fit-content;
    max-width: 80%;
  }
  .typing { display: flex; gap: 4px; padding: 8px 0; }
  .typing span { width: 5px; height: 5px; background: var(--dim); border-radius: 50%; animation: pulse 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

  #bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 14px 20px 18px; z-index: 1; flex-shrink: 0;
  }
  #row { display: flex; gap: 10px; }
  #row input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; color: var(--text); font-family: var(--font); font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  #row input:focus { border-color: var(--accent); }
  #row input::placeholder { color: var(--dim); font-style: italic; }
  #row button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 10px 18px; font-family: var(--font); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  #row button:hover { background: var(--accent-hover); }
  #row button:disabled { opacity: .35; cursor: not-allowed; }
  @media (max-width: 600px) { .msg { max-width: 100%; } header { padding: 0 12px; } #chat { padding: 12px; } #bar { padding: 10px 12px 14px; } }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="icon">◈</span> Ananse</div>
  <div class="badge" id="modeBadge">NORMAL</div>
  <div class="right"><span class="dot on" id="dot"></span><span id="statusTxt">Connected</span></div>
</header>
<div id="chat"></div>
<div id="bar">
  <div id="row">
    <input type="text" id="input" placeholder="Type a message..." autofocus />
    <button id="send">Send</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), input = $('#input'), send = $('#send'), badge = $('#modeBadge');

function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role;
  const l = document.createElement('div'); l.className = 'label';
  l.textContent = role === 'user' ? 'You' : 'Ananse';
  d.appendChild(l);
  const b = document.createElement('div'); b.className = 'bubble';
  b.textContent = text; d.appendChild(b);
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

let typingEl = null;
function showTyping() {
  if (typingEl) return;
  typingEl = document.createElement('div'); typingEl.className = 'msg assistant';
  const b = document.createElement('div'); b.className = 'bubble';
  const t = document.createElement('div'); t.className = 'typing';
  for (let i = 0; i < 3; i++) { const s = document.createElement('span'); t.appendChild(s); }
  b.appendChild(t); typingEl.appendChild(b); chat.appendChild(typingEl);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

function setMode(m) { badge.textContent = m; badge.className = 'badge ' + m.toLowerCase(); }

async function sendMsg(text) {
  if (!text.trim()) return;
  const t = text.trim().toLowerCase();
  if (['offense','defense','normal'].includes(t)) { setMode(t.toUpperCase()); addMsg('assistant', 'Switched to ' + t.toUpperCase() + ' mode.'); input.value = ''; return; }
  input.value = ''; addMsg('user', text); showTyping();
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text, mode:badge.textContent}) });
    hideTyping();
    if (!r.ok) { addMsg('assistant','Error: ' + (await r.text())); return; }
    const d = await r.json();
    addMsg('assistant', d.response || '(no response)');
    if (d.mode && d.mode !== badge.textContent) setMode(d.mode);
  } catch(e) { hideTyping(); addMsg('assistant','Connection error'); }
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(input.value); });
send.addEventListener('click', () => sendMsg(input.value));
addMsg('assistant', 'Ananse — Advanced Neural Agent for Network Security Exploitation. Ready. What would you like to do?');
</script>
</body>
</html>
