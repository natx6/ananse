<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananse — C2 Console</title>
<style>
  :root {
    --bg: #0d0d12;
    --surface: #13131b;
    --surface2: #1a1a24;
    --border: #1e1e2e;
    --text: #d4d4e0;
    --dim: #6b6b80;
    --accent: #d42a3a;
    --accent-hover: #e84c5e;
    --cyan: #3dd4c8;
    --cyan-dim: rgba(61,212,200,0.1);
    --green: #3cc46a;
    --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 25% 40%, rgba(212,42,58,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 75% 60%, rgba(61,212,200,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    height: 52px;
    gap: 16px;
    z-index: 1;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
  }
  .logo {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .icon {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .mode-badge {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(212,42,58,0.15);
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 1px;
    border: 1px solid rgba(212,42,58,0.2);
  }
  .mode-badge.defense {
    background: rgba(61,212,200,0.1);
    color: var(--cyan);
    border-color: rgba(61,212,200,0.2);
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--dim);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
  }
  .status-dot.off { background: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    z-index: 1;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    margin-bottom: 20px;
    max-width: 80%;
    animation: msgIn 0.25s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { margin-left: auto; }
  .msg .label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .msg.user .label { text-align: right; color: var(--cyan); }
  .msg .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
  }
  .msg.user .bubble {
    background: var(--cyan-dim);
    border-color: rgba(61,212,200,0.15);
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 5px; height: 5px;
    background: var(--dim);
    border-radius: 50%;
    animation: pulse 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  #input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 24px 20px;
    z-index: 1;
    flex-shrink: 0;
  }
  #input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  #input-row input:focus { border-color: var(--accent); }
  #input-row input::placeholder { color: var(--dim); font-style: italic; }
  #input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.3px;
  }
  #input-row button:hover { background: var(--accent-hover); }
  #input-row button:disabled { opacity: 0.35; cursor: not-allowed; }

  @media (max-width: 600px) {
    .msg { max-width: 100%; }
    header { padding: 0 14px; }
    #chat { padding: 14px; }
    #input-bar { padding: 12px 14px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="icon">◈</span> Ananse</div>
  <div class="mode-badge" id="modeBadge">OFFENSE</div>
  <div class="header-right">
    <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusTxt">Connected</span></div>
  </div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <div id="input-row">
    <input type="text" id="input" placeholder="Type a message..." autofocus />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const modeBadge = document.getElementById('modeBadge');

function addMsg(role, content) {
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const l = document.createElement('div');
  l.className = 'label';
  l.textContent = role === 'user' ? 'You' : 'Ananse';
  d.appendChild(l);
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = content;
  d.appendChild(b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const d = document.createElement('div');
  d.className = 'msg assistant';
  d.id = 'typing';
  const b = document.createElement('div');
  b.className = 'bubble';
  const t = document.createElement('div');
  t.className = 'typing';
  for (let i = 0; i < 3; i++) { const s = document.createElement('span'); t.appendChild(s); }
  b.appendChild(t);
  d.appendChild(b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() { const e = document.getElementById('typing'); if (e) e.remove(); }

function setMode(m) {
  modeBadge.textContent = m;
  modeBadge.className = 'mode-badge' + (m === 'DEFENSE' ? ' defense' : '');
}

async function send(text) {
  if (!text.trim()) return;
  input.value = '';
  addMsg('user', text);

  const t = text.toLowerCase().trim();
  if (t === 'offense' || t === 'defense' || t === 'normal' || /^(switch|change|go)\s+to\s+(normal|offense|defense)$/i.test(t)) {
    const m = t.match(/(normal|offense|defense)/i)[1].toUpperCase();
    setMode(m);
    addMsg('assistant', `Switched to ${m} mode.`);
    return;
  }

  addTyping();
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, mode: modeBadge.textContent }) });
    removeTyping();
    if (!r.ok) { addMsg('assistant', `Error: ${await r.text()}`); return; }
    const d = await r.json();
    addMsg('assistant', d.response || '(no response)');
    if (d.mode && d.mode !== modeBadge.textContent) setMode(d.mode);
  } catch (e) { removeTyping(); addMsg('assistant', `Connection error: ${e.message}`); }
}

input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(input.value); } });
sendBtn.addEventListener('click', () => send(input.value));

addMsg('assistant', 'Ananse — Advanced Neural Agent for Network Security Exploitation, in OFFENSE mode. I can perform red-team operations, deploy C2 implants, and manage targets. What would you like to do?');
</script>
</body>
</html>
