<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananse — C2 Console</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1a1a2e;
    --text: #c8c8d4;
    --dim: #666680;
    --accent: #d4273c;
    --accent2: #e84c5e;
    --cyan: #4ad4c8;
    --green: #40c466;
    --font: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Spider-web background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(212,39,60,0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(74,212,200,0.03) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, transparent 0%, var(--bg) 100%);
    pointer-events: none;
    z-index: 0;
  }
  /* Web pattern overlay */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(26,26,46,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,26,46,0.3) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 1;
    flex-shrink: 0;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .logo span { color: var(--cyan); }
  .mode-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .mode-badge.defense { background: #1a6a6a; color: var(--cyan); }
  .conn-status {
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
  }
  .conn-status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--green);
  }
  .conn-status .dot.off { background: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    z-index: 1;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar {
    width: 6px;
  }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    margin-bottom: 16px;
    max-width: 85%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { margin-left: auto; }
  .msg .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .msg.user .label { text-align: right; color: var(--cyan); }
  .msg .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: rgba(74,212,200,0.06);
    border-color: rgba(74,212,200,0.2);
  }
  .msg .bubble .tool-call {
    color: var(--accent2);
    font-size: 12px;
  }
  .msg .bubble .tool-result {
    color: var(--dim);
    font-size: 12px;
    border-left: 2px solid var(--border);
    padding-left: 10px;
    margin-top: 6px;
  }

  #input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    z-index: 1;
    flex-shrink: 0;
  }
  #input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  #input-row input:focus { border-color: var(--accent); }
  #input-row input::placeholder { color: var(--dim); }
  #input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    font-weight: 600;
  }
  #input-row button:hover { background: var(--accent2); }
  #input-row button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .typing {
    display: inline-flex;
    gap: 3px;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px;
    background: var(--dim);
    border-radius: 50%;
    animation: pulse 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @media (max-width: 600px) {
    .msg { max-width: 100%; }
    header { padding: 10px 14px; }
    #chat { padding: 14px; }
    #input-bar { padding: 10px 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">◈ <span>Ananse</span></div>
  <div class="mode-badge" id="modeBadge">OFFENSE</div>
  <div class="conn-status"><span class="dot" id="statusDot"></span><span id="statusText">Connected</span></div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <div id="input-row">
    <input type="text" id="input" placeholder="Type a message..." autofocus />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const modeBadge = document.getElementById('modeBadge');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let currentMode = 'OFFENSE';

function addMessage(role, content, extra) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? 'You' : 'Ananse';
  div.appendChild(label);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  div.appendChild(bubble);
  if (extra) {
    const e = document.createElement('div');
    e.className = 'tool-result';
    e.textContent = extra;
    div.appendChild(e);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing-indicator';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'Ananse';
  div.appendChild(label);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const typing = document.createElement('div');
  typing.className = 'typing';
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('span');
    typing.appendChild(s);
  }
  bubble.appendChild(typing);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function setMode(mode) {
  currentMode = mode;
  modeBadge.textContent = mode;
  modeBadge.className = 'mode-badge' + (mode === 'DEFENSE' ? ' defense' : '');
}

async function sendMessage(text) {
  if (!text.trim()) return;
  input.value = '';
  addMessage('user', text);

  // Quick mode detection
  const t = text.toLowerCase().trim();
  if (t === 'offense' || t === 'defense' || t === 'normal' ||
      /^(switch|change|go)\s+to\s+(normal|offense|defense)$/i.test(t)) {
    let mode = t.match(/(normal|offense|defense)/i)[1].toUpperCase();
    setMode(mode);
    addMessage('assistant', `Switched to ${mode} mode.`);
    return;
  }

  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, mode: currentMode }),
    });

    removeTyping();

    if (!res.ok) {
      const err = await res.text();
      addMessage('assistant', `Error: ${err}`);
      return;
    }

    const data = await res.json();
    addMessage('assistant', data.response || '(no response)');
    if (data.mode && data.mode !== currentMode) {
      setMode(data.mode);
    }
  } catch (err) {
    removeTyping();
    addMessage('assistant', `Connection error: ${err.message}`);
  }
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(input.value);
  }
});
sendBtn.addEventListener('click', () => sendMessage(input.value));

// Auto-intro
addMessage('assistant', 'Ananse — Advanced Neural Agent for Network Security Exploitation, in OFFENSE mode. I can perform red-team operations, deploy C2 implants, and manage targets. What would you like to do?');
</script>
</body>
</html>
